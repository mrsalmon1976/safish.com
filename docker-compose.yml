services:
  jekyll:
    build: .
    ports:
      - "4000:4000"   # site
      - "35729:35729" # livereload
    volumes:
      - .:/srv/jekyll
      - jekyll-bundle-ruby33:/usr/local/bundle
    command: bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling --future

volumes:
  jekyll-bundle-ruby33:
